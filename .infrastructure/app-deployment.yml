apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
  namespace: mysql
type: Opaque
stringData:
  NAME: todoapp
  USER: todoapp
  PASSWORD: todopass
  HOST: mysql-0.mysql.mysql.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
        - name: todoapp
          image: todoapp:latest
          envFrom:
            - secretRef:
                name: app-db-secret
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
